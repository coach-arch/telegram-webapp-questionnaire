<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Survey Type</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      color: var(--tg-theme-text-color, #000000);
      background: var(--tg-theme-bg-color, #ffffff);
    }

    h3 {
      margin-top: 0;
      margin-bottom: 16px;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      display: flex;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      line-height: 1.3;
      transition: background 0.2s;
    }

    .option:hover {
      background: rgba(0, 0, 0, 0.03);
    }

    input[type="radio"] {
      transform: scale(1.3);
      margin-right: 12px;
      flex-shrink: 0;
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 24px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <h3>Select Function Option:</h3>

  <div class="options-container">
    <label class="option">
      <input type="radio" name="survey_option" value="Initial">
      Initial
    </label>
    <label class="option">
      <input type="radio" name="survey_option" value="Encore">
      Encore
    </label>
    <label class="option">
      <input type="radio" name="survey_option" value="Health Survey">
      Health Survey
    </label>
  </div>

  <button type="button" onclick="submitSelection()">Confirm & Submit</button>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Replace with your secondary n8n Webhook URL
    const N8N_WEBHOOK_URL = "https://adamsses.app.n8n.cloud/webhook/92763029-bb43-4a04-af59-a5a88e15f60b";

    function closeWindow() {
      if (tg && typeof tg.close === 'function') {
        tg.close();
      }
      setTimeout(() => {
        window.close();
      }, 100);
    }

    async function submitSelection() {
      const submitBtn = document.querySelector('button');
      const selectedOption = document.querySelector('input[name="survey_option"]:checked');

      if (!selectedOption) {
        if (tg && tg.showAlert) {
          tg.showAlert("Please select an option.");
        } else {
          alert("Please select an option.");
        }
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const pageId = urlParams.get('page_id') || null;

      // Show loading state
      submitBtn.innerText = "Submitting...";
      submitBtn.disabled = true;

      try {
        const response = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            page_id: pageId,
            selected_option: selectedOption.value,
            telegram_user: tg?.initDataUnsafe?.user || null
          })
        });

        if (response.ok) {
          if (tg && tg.showAlert) {
            tg.showAlert("Success! Option submitted.", () => {
              closeWindow();
            });
          } else {
            alert("Success! Option submitted.");
            closeWindow();
          }
        } else {
          if (tg && tg.showAlert) {
            tg.showAlert("Failed to submit. Server returned error.");
          } else {
            alert("Failed to submit. Server returned error.");
          }
          submitBtn.innerText = "Confirm & Submit";
          submitBtn.disabled = false;
        }
      } catch (err) {
        if (tg && tg.showAlert) {
          tg.showAlert("Error sending request: " + err.message);
        } else {
          alert("Error sending request: " + err.message);
        }
        submitBtn.innerText = "Confirm & Submit";
        submitBtn.disabled = false;
      }
    }
  </script>

</body>
</html>
