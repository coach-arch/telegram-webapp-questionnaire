<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Survey Options</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      color: var(--tg-theme-text-color, #000000);
      background: var(--tg-theme-bg-color, #ffffff);
    }

    h3 {
      margin-top: 0;
      margin-bottom: 16px;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      display: flex;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      line-height: 1.3;
      transition: background 0.2s;
    }

    .option:hover {
      background: rgba(0, 0, 0, 0.03);
    }

    input[type="checkbox"] {
      transform: scale(1.3);
      margin-right: 12px;
      flex-shrink: 0;
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 24px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
    }

    #status.success {
      display: block;
      background: #e6f4ea;
      color: #1e7e34;
    }

    #status.error {
      display: block;
      background: #fdecea;
      color: #b3261e;
    }
  </style>
</head>
<body>

  <h3>Select Function Options:</h3>

  <div class="options-container">
    <label class="option">
      <input type="checkbox" name="survey_option" value="Initial">
      Initial
    </label>
    <label class="option">
      <input type="checkbox" name="survey_option" value="Encore">
      Encore
    </label>
    <label class="option">
      <input type="checkbox" name="survey_option" value="Health Survey">
      Health Survey
    </label>
  </div>

  <button type="button" onclick="submitSelection()">Confirm & Submit</button>

  <div id="status" role="status" aria-live="polite"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const N8N_WEBHOOK_URL = "https://adamsses.app.n8n.cloud/webhook/92763029-bb43-4a04-af59-a5a88e15f60b";

    function closeWindow() {
      try {
        if (tg && typeof tg.close === 'function') {
          tg.close();
        }
      } catch (e) {}
      setTimeout(() => {
        window.close();
      }, 100);
    }

    // Telegram popups only work inside a real Mini App (v6.2+). When the page is
    // opened from a normal link button, tg.showAlert() throws, which used to hide
    // the success message. Fall back to a browser alert in that case.
    function canUseTgPopup() {
      return !!(tg && tg.initData && typeof tg.isVersionAtLeast === 'function' && tg.isVersionAtLeast('6.2'));
    }

    function notify(message, callback) {
      if (canUseTgPopup()) {
        try {
          tg.showAlert(message, callback);
          return;
        } catch (e) {}
      }
      try { alert(message); } catch (e) {}
      if (callback) callback();
    }

    function setStatus(message, type) {
      const el = document.getElementById('status');
      el.textContent = message;
      el.className = type;
    }

    async function submitSelection() {
      const submitBtn = document.querySelector('button');
      const selectedBoxes = document.querySelectorAll('input[name="survey_option"]:checked');
      const selectedValues = Array.from(selectedBoxes).map(cb => cb.value);

      if (selectedValues.length === 0) {
        notify("Please select at least one option.");
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const pageId = urlParams.get('page_id') || null;

      // Show loading state
      submitBtn.innerText = "Submitting...";
      submitBtn.disabled = true;

      try {
        const response = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            page_id: pageId,
            selected_options: selectedValues,
            telegram_user: tg?.initDataUnsafe?.user || null
          })
        });

        if (response.ok) {
          submitBtn.innerText = "Submitted ✓";
          setStatus("✅ Success! Options submitted. You can close this page.", "success");
          notify("Success! Options submitted.", () => {
            closeWindow();
          });
        } else {
          submitBtn.innerText = "Confirm & Submit";
          submitBtn.disabled = false;
          setStatus("Failed to submit. Server returned error.", "error");
          notify("Failed to submit. Server returned error.");
        }
      } catch (err) {
        submitBtn.innerText = "Confirm & Submit";
        submitBtn.disabled = false;
        setStatus("Error sending request: " + err.message, "error");
        notify("Error sending request: " + err.message);
      }
    }
  </script>

</body>
</html>
